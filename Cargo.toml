[package]
name = "rust-nano"
version = "2.1.0"
edition = "2021"
description = "L'éditeur Rust — IDE TUI sobre, thème Minuit profond"
license = "MIT"

[[bin]]
name = "rust-nano"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# regex-fancy : moteur 100% Rust — le crate se compile partout, Windows compris
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy", "plist-load"] }
fuzzy-matcher = "0.3"
unicode-width = "0.2"
portable-pty = "0.8"
vt100 = "0.15"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
